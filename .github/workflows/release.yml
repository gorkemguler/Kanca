name: Release

# Build the desktop app for macOS, Windows and Linux and attach the binaries to
# a GitHub Release whenever a version tag (e.g. v0.1.0) is pushed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # allow a manual run from the Actions tab (no release upload)

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            platform: darwin/universal
          - os: ubuntu-22.04
            name: linux
            platform: linux/amd64
          - os: windows-latest
            name: windows
            platform: windows/amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build
        working-directory: desktop
        run: wails build -clean -platform ${{ matrix.platform }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop/build/bin
        run: ditto -c -k --keepParent kanca.app "$GITHUB_WORKSPACE/kanca-macos-universal.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop/build/bin
        run: tar -czf "$GITHUB_WORKSPACE/kanca-linux-amd64.tar.gz" kanca

      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop/build/bin
        run: Compress-Archive -Path kanca.exe -DestinationPath "$env:GITHUB_WORKSPACE/kanca-windows-amd64.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kanca-${{ matrix.name }}
          path: |
            kanca-*.zip
            kanca-*.tar.gz
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Package browser extension
        run: |
          # Chrome extension versions are 1-4 dot-separated integers; stamp the
          # tag's version in when it fits (e.g. v0.2.0 -> 0.2.0).
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            jq --arg v "$version" '.version = $v' extension/manifest.json > manifest.tmp
            mv manifest.tmp extension/manifest.json
          fi
          (cd extension && zip -r ../dist/kanca-browser-extension.zip . -x 'test/*' 'package.json' '*.go')

      - name: Publish binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          append_body: true
          body: |
            ## Install

            Download the file for your OS below, then:

            - **macOS** (`kanca-macos-universal.zip`) — unzip, then right-click `kanca.app` → **Open** on first launch (unsigned, so Gatekeeper asks once).
            - **Windows** (`kanca-windows-amd64.zip`) — unzip and run `kanca.exe`.
            - **Linux** (`kanca-linux-amd64.tar.gz`) — extract and run `./kanca` (needs `libgtk-3` and `libwebkit2gtk-4.0`).
            - **Browser extension** (`kanca-browser-extension.zip`, Chrome / Edge / Brave / Opera) — unzip, open `chrome://extensions`, turn on **Developer mode**, click **Load unpacked** and pick the unzipped folder.

            Start Kanca and press **Start proxy**, then switch the extension on (or set your browser's proxy to `127.0.0.1:8080`). To intercept HTTPS, open `http://kanca/` through the proxy — or click **Install CA certificate** in the extension — and trust the downloaded certificate. Authorised testing only.
