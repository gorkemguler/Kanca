name: Release

# Build the desktop app for macOS, Windows and Linux and attach the binaries to
# a GitHub Release whenever a version tag (e.g. v0.1.0) is pushed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # allow a manual run from the Actions tab (no release upload)

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            platform: darwin/universal
          - os: ubuntu-22.04
            name: linux
            platform: linux/amd64
          - os: windows-latest
            name: windows
            platform: windows/amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build
        working-directory: desktop
        run: wails build -clean -platform ${{ matrix.platform }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop/build/bin
        run: ditto -c -k --keepParent kanca.app "$GITHUB_WORKSPACE/kanca-macos-universal.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop/build/bin
        run: tar -czf "$GITHUB_WORKSPACE/kanca-linux-amd64.tar.gz" kanca

      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop/build/bin
        run: Compress-Archive -Path kanca.exe -DestinationPath "$env:GITHUB_WORKSPACE/kanca-windows-amd64.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kanca-${{ matrix.name }}
          path: |
            kanca-*.zip
            kanca-*.tar.gz
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Package browser extension
        run: |
          # Chrome extension versions are 1-4 dot-separated integers; stamp the
          # tag's version in when it fits (e.g. v0.2.0 -> 0.2.0).
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            jq --arg v "$version" '.version = $v' extension/manifest.json > manifest.tmp
            mv manifest.tmp extension/manifest.json
          fi
          (cd extension && zip -r ../dist/kanca-browser-extension.zip . -x 'test/*' 'package.json' '*.go')

      - name: Publish binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          append_body: true
          body: |
            ## Install

            **1. Download and run** the file for your system:

            - **macOS** (`kanca-macos-universal.zip`): unzip, then right-click `kanca.app` → **Open** the first time (it isn't notarised, so Gatekeeper asks once).
            - **Windows** (`kanca-windows-amd64.zip`): unzip and run `kanca.exe`. If SmartScreen warns, choose **More info → Run anyway**.
            - **Linux** (`kanca-linux-amd64.tar.gz`): extract and run `./kanca` (needs `libgtk-3` and `libwebkit2gtk-4.0`).

            **2. Start intercepting.** Easiest: click **Open browser**. Kanca opens Chrome, Edge or Brave already routed through it, and HTTPS works without installing anything, so you can skip step 3. To use your own browser instead, add the extension (`kanca-browser-extension.zip`, or **CA / Settings → Get the extension** in the app): unzip it, open `chrome://extensions`, turn on **Developer mode**, click **Load unpacked** and pick the folder.

            **3. Trust the Kanca certificate** (your own browser only):

            - **macOS**: in the app, **CA / Settings → Install on this Mac**. macOS asks for your password or Touch ID.
            - **Windows**: open `http://kanca/` through the proxy, download `kanca-ca.crt`, double-click it → **Install Certificate** → **Current User** → **Trusted Root Certification Authorities**.
            - **Linux and Firefox**: follow the [installation guide](https://github.com/gorkemguler/Kanca#3-trust-the-kanca-certificate-your-own-browser-only).

            Remove the certificate when you're done testing. Authorised testing only.
