<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kanca">
  <defs>
    <linearGradient id="hook" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0903f"/>
      <stop offset="100%" stop-color="#e8792b"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="#16181d"/>
  <rect x="3" y="3" width="250" height="250" rx="53" fill="none" stroke="#2a2e37" stroke-width="2"/>

  <g fill="none" stroke="url(#hook)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- eye -->
    <circle cx="150" cy="58" r="18"/>
    <!-- shank + J-bend opening left, point aiming up -->
    <path d="M150 76
             L150 150
             C150 182 150 198 126 198
             C100 198 86 178 86 154
             C86 138 95 128 108 124"/>
    <!-- barb notch near the point -->
    <path d="M108 124 L96 140"/>
  </g>

  <!-- intercepted packet sitting in the hook's throat -->
  <rect x="120" y="150" width="22" height="22" rx="5" transform="rotate(45 131 161)" fill="#4a9eff"/>
</svg>
